; ******************************************************************************************
; working environment for template of custom firmware
; ******************************************************************************************

; Common build settings across this custom device
[env_oled_monitor_panel]
build_flags = 
	-DMF_CUSTOMDEVICE_SUPPORT=1							; Required for Custom Devices
	-DMF_CUSTOMDEVICE_HAS_UPDATE						; if the custom device needs to be updated, uncomment this. W/o the following define it will be done each loop()
	;-DMF_CUSTOMDEVICE_POLL_MS=10 						; time in ms between updating custom device, uncomment this if custom device needs to be updated regulary
	-DSSD1306_NO_SPLASH									; disable Adafruit splash logo for SSD1306 displays
	-DSH110X_NO_SPLASH									; disable Adafruit splash logo for SH1106 displays
	-I./src/src/MF_CustomDevice							; don't change this one!
	-I./OLED_Monitor_Panel										; Include files for your custom device, replace "_template" by your folder name
build_src_filter = 
	+<./MF_CustomDevice>								; don't change this one!
	+<../OLED_Monitor_Panel>										; build files for your custom device, replace "_template" by your folder name
lib_deps =												; You can add additional libraries if required
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit SH110X @ ^2.1.10
custom_core_firmware_version = 3.0.0					; define the version from the core firmware files your build should base on
custom_source_folder = OLED_Monitor_Panel							; path to your Custom Device Sources, replace "Template" by your folder name
custom_community_project = OLED_Monitor_Panel		; Folder name inside the ZIP file
custom_zip_filename = OLED_Monitor_Panel			; Name of the generated ZIP file


; Build settings for the Arduino Mega with Custom Firmware Template
[env:oled_monitor_panel_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = 
	${env.build_flags}									; don't change this one!
	${env_oled_monitor_panel.build_flags}					; don't change this one!
	-DMEMLEN_CONFIG=1496								; max. size for config stored in EEPROM (matches EEPROMSize in board.json)
	-DMEMLEN_NAMES_BUFFER=1000							; max. size for configBuffer, contains only names from inputs
	-DMF_MAX_DEVICEMEM=1600								; max. memory size for devices
	'-DMOBIFLIGHT_TYPE="OLED Monitor Panel Mega"'			; this must match with "MobiFlightType" within the .json file
	'-DMOBIFLIGHT_NAME="OLED Panel"' 				; this will show up as Name in the settings dialog unless it gets change from there
build_unflags =											; only OLED displays are attached to this board.
	-DMF_SEGMENT_SUPPORT								; Buttons, encoders and outputs (LEDs) are always
	-DMF_LCD_SUPPORT									; compiled in - they are not behind any flag - so
	-DMF_STEPPER_SUPPORT								; they keep working. Analog stays enabled for a
	-DMF_SERVO_SUPPORT									; possible brightness pot (costs only ~1.2 kB).
	-DMF_OUTPUT_SHIFTER_SUPPORT
	-DMF_INPUT_SHIFTER_SUPPORT
	-DMF_MUX_SUPPORT
	-DMF_DIGIN_MUX_SUPPORT
build_src_filter = 
	${env.build_src_filter}								; don't change this one!
	${env_oled_monitor_panel.build_src_filter}				; don't change this one!	
lib_deps = 
	${env.lib_deps}										; don't change this one!
	${env.custom_lib_deps_Atmel}						; don't change this one! You can add additional libraries if required
	${env_oled_monitor_panel.lib_deps}						; don't change this one!
monitor_speed = 115200									; don't change this one!
extra_scripts = 
	${env.extra_scripts}								; don't change this one!
	copy_fw_files.py
custom_core_firmware_version = ${env_oled_monitor_panel.custom_core_firmware_version}	; don't change this one!
custom_community_project = ${env_oled_monitor_panel.custom_community_project}			; don't change this one!
custom_source_folder = ${env_oled_monitor_panel.custom_source_folder}					; don't change this one!
custom_zip_filename = ${env_oled_monitor_panel.custom_zip_filename}					; don't change this one!

	
